name: Publish to NPM

on:
  release:
    types: [published]
  
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (npm publish --dry-run)'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10
      - name: Upgrade npm
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: npm ci
      
      - name: Build TypeScript
        run: npm run build
      
      - name: Run type checking
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci

      - name: Check release tag matches package.json
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ github.event.release.tag_name }}"
          if [ "$PKG" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      # Authenticates with OIDC via the npm trusted publisher for this repo and
      # workflow (no NPM_TOKEN); provenance is attached automatically.
      # The trusted publisher only allows *staged* publishes: the version goes
      # live after a maintainer approves it with 2FA (npmjs.com, or
      # `npm stage list mcp-cisco-support` + `npm stage approve <id>`).
      - name: Publish to NPM (dry run)
        if: github.event.inputs.dry_run == 'true'
        run: npm stage publish . --dry-run

      - name: Stage publish to NPM
        if: github.event_name == 'release' || github.event.inputs.dry_run == 'false'
        run: npm stage publish .